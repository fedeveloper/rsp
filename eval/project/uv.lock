version = 1
revision = 2
requires-python = ">=3.11"

[[package]]
name = "inventory"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "pydantic" },
    { name = "requests" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "pytest-cov" },
]

[package.metadata]
requires-dist = [
    { name = "pydantic", specifier = ">=2.6" },
    { name = "requests", specifier = ">=2.31" },
]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=8" },
    { name = "pytest-cov", specifier = ">=5" },
]

[[package]]
name = "pydantic"
version = "2.11.7"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pytest"
version = "8.4.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pytest-cov"
version = "6.2.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "requests"
version = "2.32.4"
source = { registry = "https://pypi.org/simple" }
