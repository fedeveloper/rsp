name: "RSP: Reproducible Shortcut Patrol"
description: Reports reproducible facts about shortcuts in pull requests, such as skipped tests, suppressions and undeclared deps.
author: fedeveloper
branding:
  icon: shield
  color: blue

inputs:
  github-token:
    description: Token used to write the pull request comment. Needs pull-requests write permission.
    default: ${{ github.token }}
  fail-on:
    description: '"never" (default) only reports; "any" fails the step when there is at least one finding.'
    default: never
  exclude:
    description: Globs of changed files to ignore, one per line or comma separated, e.g. tests/fixtures/**.
    default: ""
  rules:
    description: Rule ids to run, one per line or comma separated. Empty runs every rule.
    default: ""
  test-command:
    description: >-
      Shell command that installs dependencies and runs the tests, writing JUnit XML, e.g.
      "pip install -e .[test] && pytest --junitxml=junit.xml". When set, rsp runs it at base and at head,
      each in a separate worktree, and the tests/delta rule compares the results.
    default: ""
  junit:
    description: Glob, relative to the repository root, of the JUnit files the test command writes.
    default: "**/junit*.xml"
  coverage:
    description: >-
      Glob, relative to the repository root, of the LCOV or Cobertura coverage reports the test command writes at
      head, such as "coverage/lcov.info" or "coverage.xml". When set, the tests/uncovered-change rule reports added
      lines that did not run. Empty (default) turns it off.
    default: ""
  test-retries:
    description: Extra runs at head while tests fail there but passed at base, to clear flaky failures.
    default: "1"
  comment:
    description: '"true" (default) keeps one comment on the pull request up to date; "false" writes only the job summary.'
    default: "true"

outputs:
  findings:
    description: Number of findings.
  report:
    description: Path of the JSON report.

runs:
  using: node24
  main: action-dist/index.js
