# Runs this repository's own action on its pull requests.
name: RSP

on:
  pull_request:

permissions: {}

concurrency:
  group: rsp-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rsp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          # Fixtures and the evaluation corpus contain risky changes on purpose.
          exclude: |
            test/fixtures/**
            eval/project/**
            eval/project-js/**
            eval/project-go/**
