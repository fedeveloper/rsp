# Runs this repository's own action on its pull requests.
name: rsp

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  rsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./
        with:
          # Fixtures and the evaluation corpus contain risky changes on purpose.
          exclude: |
            test/fixtures/**
            eval/project/**
