name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run rsp on this pull request
        if: github.event_name == 'pull_request' && matrix.node == 24
        run: node dist/cli.js check --base "origin/${{ github.base_ref }}" --head HEAD >> "$GITHUB_STEP_SUMMARY"
