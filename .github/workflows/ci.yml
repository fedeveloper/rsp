name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the action bundle is up to date
        run: npm run bundle && git diff --exit-code action-dist
      - name: Check the evaluation results are up to date
        run: npm run eval && git diff --exit-code eval/RESULTS.md eval/RESULTS-mtgo.md
