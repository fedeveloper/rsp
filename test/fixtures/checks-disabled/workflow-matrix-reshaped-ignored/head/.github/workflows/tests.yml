name: tests
on: pull_request
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {python: '3.14'}
          - {python: '3.14t'}
          - {python: '3.13', tox: 'py3.13,py3.13t'}
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install tox
          tox run -e ${{ matrix.tox || format('py{0}', matrix.python) }}
