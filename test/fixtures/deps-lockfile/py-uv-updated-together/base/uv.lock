version = 1
revision = 2
requires-python = ">=3.11"

[[package]]
name = "inventory"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "pydantic" },
    { name = "requests" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "pydantic", specifier = ">=2.6" },
    { name = "requests", specifier = ">=2.31" },
]

[package.metadata.requires-dev]
dev = [{ name = "pytest", specifier = ">=8" }]

[[package]]
name = "requests"
version = "2.32.3"
source = { registry = "https://pypi.org/simple" }
